$schema: https://json-schema.org/draft/2020-12/schema
$id: AdaptiveModelConfig.yaml
type: object
properties:
  enabled:
    type: boolean
    default: false
    description: "Route each task to a model tier matching its complexity (default: false)"
  high:
    type: string
    description: "Explicit model for High-complexity tasks (default: derived from the pinned model)"
  medium:
    type: string
    description: "Explicit model for Medium-complexity tasks (default: derived from the pinned model)"
  low:
    type: string
    description: "Explicit model for Low-complexity tasks (default: derived from the pinned model)"
  highAgentType:
    $ref: AgentType.yaml
    description: Provider for the explicit High model; omitted means the run's pinned provider
  mediumAgentType:
    $ref: AgentType.yaml
    description: Provider for the explicit Medium model; omitted means the run's pinned provider
  lowAgentType:
    $ref: AgentType.yaml
    description: Provider for the explicit Low model; omitted means the run's pinned provider
required:
  - enabled
description: Adaptive per-task model tier selection
