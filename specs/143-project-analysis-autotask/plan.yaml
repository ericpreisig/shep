content: '## Clean Architecture

  TypeSpec defines discovered-feature provenance and AutoTask plans. Application services depend on existing
  file-tree and agent ports. SQLite owns analysis/plan leases and persistence. Web controls reuse the
  creation drawer, feature overview and mind map.


  ## Validation

  RED-GREEN-REFACTOR TDD for source evidence, reanalysis deduplication, invalid dependency plans, joins with existing tasks,
  idempotent materialization and deferred starts. Run focused tests, broad regressions, typecheck, lint
  and release build, then verify real Codex and browser behavior.'
