content: '## Clean Architecture

  TypeSpec defines optional per-tier agent types alongside existing model strings.
  Additive SQLite columns preserve old settings. Resolve selected executors through
  IAgentExecutorProvider, using the matching stored provider config. Worker wiring
  preserves feature context and checks its space policy.


  ## RED-GREEN-REFACTOR

  Add failing catalog, stale-label, reset, settings round-trip, credential isolation
  and runtime dispatch tests. Implement the minimal extension to existing selectors
  and routing. Reuse current handoffs, batching, cancellation and final validation.


  ## Validation

  Run affected tests on Node 24, typecheck, scoped lint and CLI/web builds. Inspect
  actual French UI without disturbing active workers. Keep default provider/model
  and enabled state unchanged.

  '
